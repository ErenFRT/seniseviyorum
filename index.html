<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sevilay, sana bir sorum var 💌</title>
<meta property="og:title" content="Sevilay, sana bir sorum var 💌">
<meta property="og:description" content="Aç ve dürüstçe cevap ver 🙈">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: linear-gradient(160deg, #ffe3ec 0%, #ffc2d4 50%, #ff9ebb 100%);
    color: #7a1f3d;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .float-heart {
    position: absolute; bottom: -40px; opacity: .55;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  .card {
    position: relative; z-index: 1;
    width: min(92vw, 420px);
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 34px 26px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(160, 30, 70, .25);
  }
  .emoji { font-size: 72px; line-height: 1; margin-bottom: 14px; display: inline-block; animation: beat 1.2s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }
  h1 { font-family: 'Dancing Script', cursive; font-size: 44px; line-height: 1.15; margin-bottom: 8px; color: #c2185b; }
  p.sub { font-size: 16px; opacity: .8; margin-bottom: 26px; min-height: 22px; }
  .buttons { display: flex; justify-content: center; align-items: center; gap: 18px; min-height: 64px; }
  button {
    font-family: inherit; font-weight: 700; font-size: 18px;
    border: none; border-radius: 999px; padding: 14px 34px;
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  #yes {
    background: linear-gradient(135deg, #ff4f8b, #e91e63); color: #fff;
    box-shadow: 0 8px 20px rgba(233, 30, 99, .4);
    transition: transform .25s ease, font-size .25s ease, padding .25s ease;
  }
  #yes:active { transform: scale(.96); }
  #no { background: #fff; color: #c2185b; border: 2px solid #f8bbd0; }
  #no.runaway { position: fixed; z-index: 5; transition: left .18s ease, top .18s ease; }

  #result { display: none; }
  #result h1 { font-size: 46px; }
  .share {
    margin-top: 6px;
    background: linear-gradient(135deg, #25d366, #128c7e); color: #fff;
    box-shadow: 0 8px 20px rgba(18, 140, 126, .35);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .share svg { width: 22px; height: 22px; fill: #fff; }
  .copy { margin-top: 12px; background: transparent; color: #c2185b; font-size: 15px; padding: 8px 16px; text-decoration: underline; }
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(40px);
    background: #7a1f3d; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: all .3s ease; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .burst { position: fixed; pointer-events: none; z-index: 8; font-size: 26px; animation: burst 1.4s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.6) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
  <div id="hearts"></div>

  <main class="card" id="question">
    <div class="emoji">🥺</div>
    <h1 id="title">Sevilay, beni seviyor musun?</h1>
    <p class="sub" id="sub">Dürüst ol ama... 👉👈</p>
    <div class="buttons">
      <button id="yes">Evet 💖</button>
      <button id="no">Hayır</button>
    </div>
  </main>

  <main class="card" id="result">
    <div class="emoji">🥰</div>
    <h1>Biliyordum Sevilay'ım!</h1>
    <p class="sub">Ben de seni çok seviyorum 💕<br>Şimdi cevabını bana gönder 👇</p>
    <button class="share" id="share">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      Cevabımı Gönder
    </button>
    <br>
    <button class="copy" id="copy">ya da mesajı kopyala</button>
  </main>

  <div class="toast" id="toast"></div>

<script>
  // ---- Ayarlar (link ile de verilebilir: ?isim=Ayşe&tel=905551234567) ----
  const params = new URLSearchParams(location.search);
  const isim = params.get('isim') || 'Sevilay';
  const tel = (params.get('tel') || '').replace(/\D/g, '');
  if (isim) document.getElementById('title').textContent = isim + ', beni seviyor musun?';

  const noTexts = [
    'Emin misin? 🤨', 'Bir daha düşün 😢', 'Yanlış butona bastın galiba 🙃',
    'Kalbimi kırıyorsun 💔', 'Hayır diye bir seçenek yok aslında 😌',
    'Yakalayamazsın 😜', 'Pes et artık 😂', 'Evet\'e bas işte 🥹'
  ];
  let tries = 0;

  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const sub = document.getElementById('sub');

  function moveNo() {
    tries++;
    if (!no.classList.contains('runaway')) {
      const r = no.getBoundingClientRect();
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      no.classList.add('runaway');
    }
    const pad = 16;
    const w = no.offsetWidth, h = no.offsetHeight;
    const yr = yes.getBoundingClientRect();
    let x, y, guard = 0;
    do {
      x = pad + Math.random() * (window.innerWidth - w - pad * 2);
      y = pad + Math.random() * (window.innerHeight - h - pad * 2);
      guard++;
    } while (guard < 30 &&
      x < yr.right + 20 && x + w > yr.left - 20 &&
      y < yr.bottom + 20 && y + h > yr.top - 20);
    no.style.left = x + 'px'; no.style.top = y + 'px';

    sub.textContent = noTexts[(tries - 1) % noTexts.length];
    const scale = Math.min(1 + tries * 0.12, 2.2);
    yes.style.transform = 'scale(' + scale + ')';
  }

  // Masaüstü: fare yaklaşınca kaç. Mobil: dokununca kaç.
  no.addEventListener('mouseenter', moveNo);
  no.addEventListener('touchstart', e => { e.preventDefault(); moveNo(); }, { passive: false });
  no.addEventListener('click', e => { e.preventDefault(); moveNo(); });

  yes.addEventListener('click', () => {
    no.style.display = 'none';
    document.getElementById('question').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    burst(window.innerWidth / 2, window.innerHeight / 2, 40);
    for (let i = 0; i < 25; i++) setTimeout(spawnHeart, i * 80);
  });

  function getMessage() {
    return tries > 0
      ? 'Evet, seni seviyorum! 💖 (' + tries + ' kez Hayır\'a basmaya çalıştım ama kaçtı 😅)'
      : 'Evet, seni seviyorum! 💖 Hiç düşünmeden Evet dedim 🥰';
  }

  document.getElementById('share').addEventListener('click', async () => {
    const text = getMessage();
    if (tel) {
      location.href = 'https://wa.me/' + tel + '?text=' + encodeURIComponent(text);
      return;
    }
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  });

  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(getMessage()); toast('Kopyalandı! Şimdi bana yapıştır 💌'); }
    catch { toast(getMessage()); }
  });

  function toast(t) {
    const el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ---- Kalpler ----
  const heartsEl = document.getElementById('hearts');
  const heartChars = ['💖', '💕', '💗', '❤️', '💘', '🌸'];
  function spawnHeart() {
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 22) + 'px';
    h.style.animationDuration = (5 + Math.random() * 5) + 's';
    heartsEl.appendChild(h);
    setTimeout(() => h.remove(), 10500);
  }
  setInterval(spawnHeart, 450);

  function burst(cx, cy, n) {
    for (let i = 0; i < n; i++) {
      const b = document.createElement('span');
      b.className = 'burst';
      b.textContent = heartChars[i % heartChars.length];
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
      b.style.left = cx + 'px'; b.style.top = cy + 'px';
      b.style.setProperty('--dx', Math.cos(a) * d + 'px');
      b.style.setProperty('--dy', Math.sin(a) * d + 'px');
      b.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1500);
    }
  }
</script>
</body>
</html>
